name: Kitaab Reader APK

# Builds the Android book reader in kitaab-reader/ and uploads the installable APK.
on:
  push:
    paths:
      - 'kitaab-reader/**'
      - '.github/workflows/kitaab-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitaab-reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Kitaab-Reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kitaab-Reader-apk
          path: kitaab-reader/Kitaab-Reader.apk
          retention-days: 90
