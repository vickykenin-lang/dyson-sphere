name: Kitaab Reader APK

# Builds the Android book reader in kitaab-reader/ and uploads the installable APK.
on:
  push:
    paths:
      - 'kitaab-reader/**'
      - '.github/workflows/kitaab-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitaab-reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Kitaab-Reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kitaab-Reader-apk
          path: kitaab-reader/Kitaab-Reader.apk
          retention-days: 90

      # Keep a copy of the APK on the branch, so it can be downloaded straight from the repository.
      # Pushes made with GITHUB_TOKEN do not start another run.
      - name: Save the APK to the branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p kitaab-reader/release
          cp kitaab-reader/Kitaab-Reader.apk kitaab-reader/release/Kitaab-Reader.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kitaab-reader/release/Kitaab-Reader.apk
          git commit -m "Kitaab Reader APK built from ${GITHUB_SHA::7}" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
